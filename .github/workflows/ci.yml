name: Portfolio CI

on:
  push:
    branches:
      - main
      - feat/radiant-blue-dark-explorer
      - feat/radiant-blue-white-portfolio
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run smoke checks
        run: npm test

      - name: Build production bundle
        run: npm run build
